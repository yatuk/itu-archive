name: kontenjan

# Kontenjan doluluğunun zaman serisi. Ders programından ayrı çalışıyor çünkü
# frekansı farklı: ders programı günde bir kez yeterli, kontenjan kayıt
# haftasında sık aralıkla anlamlı.
#
# Saatte bir koşuyor ama komut değişen bir şey yoksa dosyaya dokunmuyor,
# dolayısıyla sakin dönemlerde commit üretmiyor. Kayıt haftasında kendiliğinden
# yoğunlaşıyor, ayrıca bir ayar gerekmiyor.
# Not: GitHub, 30 dk gibi alt-saatlik cron'ları yük altında güvenilir
# tetiklemiyor (gözlemlenen gerçek aralık 30 dk yerine saatlerce sürüyordu) —
# saatlik zaten GitHub'ın planlayabildiği en kısa aralıklardan biri.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  quota:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Ölçüm al
        run: go run ./cmd/quota

      - name: Veriyi doğrula
        run: go run ./cmd/validate -quiet -skip-site

      - name: SEO sayfalarını veriden üret
        run: go run ./cmd/site

      - name: Commit
        run: |
          if git diff --quiet -- docs; then
            echo 'Kontenjanlarda değişiklik yok.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name  'itu-scraper[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs
          git commit -m "kontenjan: $(date -u +'%Y-%m-%d %H:%M') UTC ölçümü"
          for wait in 5 10 20 40; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep "$wait"
          done
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push
          exit $?
