name: site

# Her push ve PR'de test + veri bütünlüğü denetimi.
# SEO sayfaları bu workflow'da üretilmez; manuel çalıştırılır (go run ./cmd/site).

on:
  push:
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Go birim testleri
        run: go test ./...

      - name: Frontend saf fonksiyon testleri
        run: node --test docs/assets/core/core.test.js

      - name: Veri bütünlüğü
        run: go run ./cmd/validate -quiet -skip-site
