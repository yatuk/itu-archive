name: scrape

on:
  schedule:
    # Her gün 03:00 UTC = 06:00 TRT. Kayıt haftalarında elle tetikleyin ya da
    # bu satırı geçici olarak '0 */3 * * *' yapın.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Tarihsel arşivi de yeniden içeri al'
        type: boolean
        default: false

# Uzun süren bir çalıştırma varken ikincisi başlarsa git push çakışır.
concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Veriyi çek
        run: |
          go run ./cmd/scrape ${{ inputs.backfill && '-backfill' || '' }}

      - name: Veriyi doğrula
        run: go run ./cmd/validate -quiet -skip-site

      - name: Boyut raporu
        run: |
          {
            echo '## Veri boyutu'
            echo '```'
            du -sh docs/data 2>/dev/null || true
            du -sh docs/data/quota 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Değişiklikleri özetle
        id: diff
        run: |
          if git diff --quiet -- docs/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo 'Değişiklik yok.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo '## Değişen veri'
            echo '```'
            git diff --stat -- docs/data | tail -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  'itu-scraper[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/data
          git commit -m "veri: $(date -u +'%Y-%m-%d %H:%M') UTC taraması"
          # Eşzamanlı bir commit araya girmişse rebase edip tekrar dene.
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
