name: mufredat

# Ders planları (hangi bölüm hangi dönemde hangi dersi zorunlu/seçmeli
# gösteriyor) OBS'de dönemde belki bir kez güncelleniyor. Ders programı gibi
# her gün taramanın anlamı yok; ayda bir + elle tetikleme yeterli.
on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

concurrency:
  group: repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  curriculum:
    runs-on: ubuntu-latest
    # 342 program × (plan listesi + detay + seçmeli grup sayfaları) — OBS'nin
    # DersPlan uçları zaman zaman çok yavaş/kararsız (context deadline exceeded
    # art arda geliyor); ilk canlı koşu 20 dk'da yarılanmadan iptal edildi.
    # Aylık, arka planda çalışan bir iş olduğundan süre kısıtı düşük öncelik.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Müfredatı çek
        run: go run ./cmd/curriculum

      - name: Veriyi doğrula
        run: go run ./cmd/validate -quiet -skip-site

      - name: SEO sayfalarını veriden üret
        run: go run ./cmd/site

      - name: Commit
        run: |
          if git diff --quiet -- docs; then
            echo 'Müfredatta değişiklik yok.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name  'itu-scraper[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs
          git commit -m "müfredat: $(date -u +'%Y-%m-%d') taraması"
          for wait in 5 10 20 40; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep "$wait"
          done
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push
          exit $?
