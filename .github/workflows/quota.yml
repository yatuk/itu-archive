name: kontenjan

# Kontenjan doluluğunun zaman serisi. Ders programından ayrı bir iş akışı olarak
# kalıyor (aynı komuta iki farklı yerden değil, buradan tetiklenmesi için).
# Yalnızca kayıt ve ekle-bırak dönemlerini kapsayan aylarda (Oca-Şub, Haz-Eki)
# haftada bir çalışıyor; sakin aylarda (Mar-May, Kas-Ara) hiç koşmuyor.
#
# Komut değişen bir şey yoksa dosyaya dokunmuyor, dolayısıyla sakin
# dönemlerde commit üretmiyor.
#
# Ekle-bırak haftası bittikten sonraki ilk tam ölçüm kesin sayıları kaydeder
# (özete finalAt yazılır); sonraki koşular o dönem için ölçüm almaz. Yeni dönem
# açılınca seri kendiliğinden yeniden başlar. "force" girdisi dondurmayı aşar.
on:
  schedule:
    - cron: '0 3 * 1,2,6-10 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Dönem donmuş olsa da ölçüm al'
        type: boolean
        default: false

concurrency:
  group: repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  quota:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Ölçüm al
        run: go run ./cmd/quota ${{ inputs.force && '-force' || '' }}

      # Dönem donmuşsa ya da sayı değişmediyse dosyaya dokunulmaz; doğrulama ve
      # site üretimi de atlanır (koşu bir dakikanın altında biter).
      - name: Değişiklik var mı
        id: diff
        run: |
          if git diff --quiet -- docs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Veriyi doğrula
        if: steps.diff.outputs.changed == 'true'
        run: go run ./cmd/validate -quiet -skip-site

      - name: SEO sayfalarını veriden üret
        if: steps.diff.outputs.changed == 'true'
        run: go run ./cmd/site

      - name: Commit
        run: |
          if git diff --quiet -- docs; then
            echo 'Kontenjanlarda değişiklik yok.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name  'itu-scraper[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs
          git commit -m "kontenjan: $(date -u +'%Y-%m-%d %H:%M') UTC ölçümü"
          for wait in 5 10 20 40; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep "$wait"
          done
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push
          exit $?
