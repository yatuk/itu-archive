name: site

# Statik SEO sayfaları üretilir, veri ve bağlantı bütünlüğü denetlenir.
# Her push ve PR'de koşar, üretim "commit ile aynı mı" denetimi yapar.

on:
  push:
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Go birim testleri
        run: go test ./...

      - name: Frontend saf fonksiyon testleri
        run: node --test docs/assets/core/core.test.js

      - name: SEO sayfalarını üret
        run: go run ./cmd/site

      - name: Üretim drift'i yok mu?
        run: |
          if git diff --exit-code -- docs/; then
            echo 'Deterministik üretim commit ile aynı.'
          else
            echo 'Üretim farklı — aşağıdaki diff''i inceleyin:'
            git diff --stat -- docs/
            echo 'İpucu: go run ./cmd/site çalıştırıp sonucu commit''leyin.'
            exit 1
          fi

      - name: Veri ve site bağlantı bütünlüğü
        run: go run ./cmd/validate -quiet
