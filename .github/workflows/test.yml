name: test

# Birim testleri ve veri doğrulama. Her push/PR'de koşar; kazıyıcı regex'leri
# ve frontend saf fonksiyonları OBS değişimlerine karşı sabit tutar.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Go birim testleri
        run: go test ./...

      - name: Frontend saf fonksiyon testleri
        run: node --test docs/assets/core/core.test.js

      - name: Veri bütünlüğü
        run: go run ./cmd/validate -quiet -skip-site

  # Tarayıcı duman testi: sayfayı gerçekten açar. Go/node testleri ve validate
  # sayfayı hiç açmıyordu — stil hiç uygulanmaması, yatay taşma, veri gelmesine
  # rağmen boş tablo gibi hatalar yalnızca burada görünür.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: Chromium indir
        run: npx playwright install --with-deps chromium

      - name: Duman testleri
        run: npx playwright test

      - name: Hata raporunu sakla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-raporu
          path: |
            playwright-report/
            test-results/
          retention-days: 7
