name: mufredat

# Ders planları (hangi bölüm hangi dönemde hangi dersi zorunlu/seçmeli
# gösteriyor) OBS'de dönemde belki bir kez güncelleniyor. Ders programı gibi
# her gün taramanın anlamı yok; ayda bir + elle tetikleme yeterli.
on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

concurrency:
  group: curriculum
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  curriculum:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Müfredatı çek
        run: go run ./cmd/curriculum

      - name: Commit
        run: |
          if git diff --quiet -- docs/data/curriculum; then
            echo 'Müfredatta değişiklik yok.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name  'itu-scraper[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/data/curriculum
          git commit -m "müfredat: $(date -u +'%Y-%m-%d') taraması"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
