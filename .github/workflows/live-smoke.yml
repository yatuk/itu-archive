name: live-smoke

# Canlı yayın (Cloudflare Pages, main'deki docs/) duman testi.
#
# Cloudflare kendi GitHub entegrasyonuyla yayınlar; GitHub'a deployment
# olayı göndermez. Bu yüzden tetikleyici docs/ değiştiren push'tur ve test
# öncesi canlı /build.json'un test edilen commit'teki docs/build.json ile
# aynı damgayı göstermesi beklenir (cmd/site/buildstamp.go).
#
# Not: veri workflow'ları GITHUB_TOKEN ile push eder; GitHub bu push'larda
# başka workflow tetiklemez. Veri yayınlarını günlük zamanlanmış koşu kapsar.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:
    inputs:
      skip_wait:
        description: 'Yayın damgasını bekleme (canlıdaki ne varsa test et)'
        type: boolean
        default: false
  schedule:
    - cron: '23 6 * * *'

permissions:
  contents: read

concurrency:
  group: live-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LIVE_BASE_URL: https://itu-ders.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Beklenen yayın damgasını oku
        id: release
        shell: bash
        run: |
          build="$(node -p "require('./docs/build.json').build")"
          test -n "$build"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Test edilen commit: ${GITHUB_SHA}, beklenen build=${build}"

      # Bağımlılık kurulumundan önce: yayın hiç gelmezse koşu boşuna Chromium indirmesin.
      - name: Cloudflare yayınını bekle (deploy not seen = test hatası değil)
        if: ${{ !inputs.skip_wait }}
        shell: bash
        env:
          DEPLOY_WAIT_SECONDS: '600'
          DEPLOY_POLL_SECONDS: '15'
        run: |
          set +e
          node scripts/wait-for-deploy.mjs --expected '${{ steps.release.outputs.build }}'
          code=$?
          if [ "$code" -eq 2 ]; then
            {
              echo "### Deploy not seen"
              echo "https://itu-ders.com 10 dakikada build \`${{ steps.release.outputs.build }}\` (commit \`${GITHUB_SHA}\`) yayınını sunmadı."
              echo "Duman testleri çalıştırılmadı; bu bir test hatası değil. Commit'teki **Cloudflare Pages** kontrolüne bakın."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"

      - name: Bağımlılıklar
        run: npm ci

      - name: Chromium indir
        run: npx playwright install --with-deps chromium

      - name: Canlı Playwright duman testi
        env:
          EXPECTED_BUILD: ${{ !inputs.skip_wait && steps.release.outputs.build || '' }}
        run: npx playwright test --config=playwright.live.config.js

      - name: Hata kanıtlarını sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-raporu
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
