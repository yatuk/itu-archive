name: site

# Her push ve PR'de test + veri bütünlüğü + deterministik SEO üretimi denetimi.

on:
  push:
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Go birim testleri
        run: go test ./...

      - name: Frontend saf fonksiyon testleri
        run: node --test docs/assets/core/core.test.js


      - name: SEO sayfalarını yeniden üret ve drift denetle
        shell: bash
        run: |
          ASSET_VERSION="$(grep -o 'style.css?v=[^" ]*' docs/index.html | head -1 | cut -d= -f2)"
          go run ./cmd/site -version "$ASSET_VERSION"
          git diff --exit-code -- docs

      - name: Veri bütünlüğü
        run: go run ./cmd/validate -quiet
